
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0 18px;
            box-sizing: border-box;
        }

        button {
            background: #16a34a;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Task</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Task Title</label>
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >

        <label>Description</label>
        <textarea name="description" rows="4">{{ task.description }}</textarea>

        <label>Due Date</label>
        <input
            type="date"
            name="due_date"
            value="{{ task.due_date|date:'Y-m-d' }}"
            required
        >

        <label>Task Priority</label>

        <select name="priority" required>
            <option value="High" {% if task.priority == 'High' %}selected{% endif %}>
                High
            </option>

            <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>
                Medium
            </option>

            <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>
                Low
            </option>
        </select>
        <br><br>

<label>Task Category</label>

<select name="category" required>

    <option value="Personal"
        {% if task.category == 'Personal' %}selected{% endif %}>
        Personal
    </option>

    <option value="Work"
        {% if task.category == 'Work' %}selected{% endif %}>
        Work
    </option>

    <option value="Study"
        {% if task.category == 'Study' %}selected{% endif %}>
        Study
    </option>

    <option value="Shopping"
        {% if task.category == 'Shopping' %}selected{% endif %}>
        Shopping
    </option>

</select>

        <button type="submit">Update Task</button>

    </form>

    <br><br>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</div>

</body>
</html>
