
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
            color: #26344d;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 18px;
            border: 1px solid #fecaca;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce1eb;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #405cf5;
            box-shadow: 0 0 0 3px #405cf520;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .profile-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 10px auto;
            border: 3px solid #e0e7ff;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .back {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
            text-align: center;
        }

        button {
            background: #405cf5;
            color: white;
        }

        button:hover {
            background: #263fca;
        }

        .back {
            background: #475569;
            color: white;
        }

        .back:hover {
            background: #334155;
        }

        @media(max-width: 400px) {
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Profile</h1>

    {% if error %}
        <div class="error">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Username</label>

        <input
            type="text"
            name="username"
            value="{{ request.user.username }}"
            maxlength="150"
            required
        >

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            value="{{ request.user.email }}"
        >

        <label>Bio</label>

        <textarea
            name="bio"
            maxlength="300"
            placeholder="Write something about yourself..."
        >{{ profile.bio }}</textarea>

        <label>Current Profile Picture</label>

        {% if profile.profile_picture %}
            <img
                src="{{ profile.profile_picture.url }}"
                class="profile-preview"
                alt="Current Profile Picture"
            >
        {% else %}
            <p>No profile picture uploaded yet.</p>
        {% endif %}

        <label>Upload New Profile Picture</label>

        <input
            type="file"
            name="profile_picture"
            accept="image/*"
        >

        <div class="buttons">

            <button type="submit">
                💾 Save Changes
            </button>

            <a href="{% url 'profile' %}" class="back">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
